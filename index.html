<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="square">
                    <div id="scoreA">
                        
                    </div>
                    
                </div>
               <div class="buttons">
                <button class="plusOne" onclick="plusOneA()">+1</button>
                <button class="plusTwo" onclick="plusTwoA()">+2</button>
                <button class="plusThree" onclick="plusThreeA()">+3</button>
               </div> 
            </div>
            
            <div class="reset">  
               <div>
                <button class="reset-btn" onclick="resetScore()">reset</button>
               </div> 
            </div>
             
            <div>
                <h3>AWAY</h3>
                 <div class="square">
                    <div id="scoreB">
                        
                    </div>
                    
                </div>
               <div class="buttons">
                <button class="plusOne" onclick="plusOneB()">+1</button>
                <button class="plusTwo" onclick="plusTwoB()">+2</button>
                <button class="plusThree" onclick="plusThreeB()">+3</button>
               </div> 
            
            </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
